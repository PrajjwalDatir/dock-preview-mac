name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build release bundle
        run: ./build.sh

      - name: Package (.zip + .dmg)
        run: ./package.sh

      # NOTE: artifacts built here are ad-hoc signed (the runner has no Developer ID),
      # so downloaders may need to right-click → Open once to get past Gatekeeper.
      # For notarized, warning-free builds, run ./notarize.sh locally with a Developer
      # ID + a stored notarytool profile, then upload to the release — or add signing
      # secrets (certificate + notary credentials) and extend this job.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent: if the release was already created (e.g. published manually
          # with locally notarized artifacts), don't clobber it.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists — skipping."
          else
            gh release create "${GITHUB_REF_NAME}" \
              dist/*.zip dist/*.dmg \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
